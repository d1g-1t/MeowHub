[project]
name = "meowhub"
version = "0.1.0"
description = "Современная платформа для обмена историями о котах"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "MeowHub Team" }]
dependencies = [
    "Django>=4.2.30,<5.0",
    "djangorestframework>=3.14",
    "djoser>=2.2",
    "django-environ>=0.11",
    "django-redis>=5.4",
    "django-cors-headers>=4.3",
    "psycopg2-binary>=2.9",
    "Pillow>=12.3.0",
    "webcolors>=1.13",
    "gunicorn>=21.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.0",
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[project.scripts]
dev = "python manage.py runserver 0.0.0.0:8000"
shell = "python manage.py shell"
test = "pytest"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "meowhub_backend.settings"
pythonpath = ["backend"]
addopts = "--tb=short --strict-markers"

